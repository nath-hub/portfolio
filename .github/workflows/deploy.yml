name: Laravel CI/CD avec FTP

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main

jobs:
  # Job de test et build
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip
        coverage: none

    - name: Vérifier la version PHP
      run: php -v

    - name: Copier .env
      run: |
        cp .env.example .env

    - name: Installer les dépendances Composer
      run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

    - name: Générer la clé d'application
      run: php artisan key:generate

    # - name: Configurer la base de données SQLite pour les tests
    #   run: |
    #     touch database/database.sqlite
    #     echo "DB_CONNECTION=sqlite" >> .env
    #     echo "DB_DATABASE=database/database.sqlite" >> .env

    - name: Exécuter les migrations
      run: php artisan migrate --force

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Installer les dépendances NPM
      run: npm ci

    - name: Compiler les assets
      run: npm run build

    - name: Exécuter les tests
      run: php artisan test

    - name: Créer le répertoire de cache
      run: |
        mkdir -p bootstrap/cache
        chmod -R 775 bootstrap/cache

    - name: Optimiser Laravel pour la production
      run: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

  # Job de déploiement via FTP
  deploy-ftp:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
    - name: Checkout du code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Installer les dépendances Composer (production)
      run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Installer et compiler les assets
      run: |
        npm ci
        npm run build


    - name: Préparer les fichiers pour le déploiement
      run: |
        # Supprimer les fichiers non nécessaires
        rm -rf .git .github tests node_modules .env.example .gitignore .editorconfig phpunit.xml

    - name: Déploiement via SFTP
      uses: easingthemes/ssh-deploy@main
      with:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
            REMOTE_HOST: ${{ secrets.FTP_SERVER }}
            REMOTE_USER: ${{ secrets.FTP_USERNAME }}
            REMOTE_PORT: 22
            SOURCE: "/"
            TARGET: "/www/"
            EXCLUDE: "/node_modules/, /.git/, /.github/, /tests/, /.env.example"
            SCRIPT_BEFORE: |
              whoami
              ls -al
            SCRIPT_AFTER: |
              cd /var/www/html
              php artisan migrate --force
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              chmod -R 775 storage bootstrap/cache

    - name: Notification de succès
      if: success()
      run: echo "✅ Déploiement réussi sur le serveur FTP!"

    - name: Notification d'échec
      if: failure()
      run: echo "❌ Le déploiement a échoué!"
