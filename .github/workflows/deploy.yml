name: Deploy Laravel Project to o2switch

on:
    push:
      branches:
        - main  # Trigger deployment on push to the develop branch
    pull_request:
      branches:
        - main  # Deploy when a pull request to the main branch is merged

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install Dependencies
        run: composer install --optimize-autoloader  --no-dev  --prefer-dist --no-scripts

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Upload files via FTP
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }} # FTP username
          password: ${{ secrets.FTP_PASSWORD }} # FTP password
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /
          timeout: 300
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .htaccess
            .env
            cd public
            if [ -d "storage" ]; then
              rmdir storage
            fi
            quit
            END_SCRIPT
